schema_version: "1.1"
name: fractions-for-kid
expected_outcome: |
  Primary-level (level 1) notes on what fractions mean and comparing unit fractions, very short sections with Easy/More detail, playful recall questions, a Colorfigures physical model (e.g. fraction bars or a pizza/cake cut into parts) he can play with, light research grounded in curriculum and documented misconceptions (bigger denominator = bigger fraction), and a study page plus doc export.
